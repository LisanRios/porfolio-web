services:
  - type: web
    name: lisanrios-porfolio-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://lisanrios-porfolio-web.onrender.com,https://porfolio-web-fe382.web.app,https://porfolio-web-fe382.firebaseapp.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
  - type: web
    name: lisanrios-porfolio-web
    runtime: static
    rootDir: porfolio-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/porfolio-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
